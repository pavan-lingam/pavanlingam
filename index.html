```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Webhook Test</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:20px;
    color:#333;
}

button{
    padding:18px 40px;
    font-size:22px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    background:linear-gradient(45deg,#ff6b6b,#ff8e53);
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

#status{
    margin-top:20px;
    font-size:18px;
    color:#444;
}
</style>
</head>
<body>

<div class="container">
    <h1>🚀 Webhook Test</h1>
    <button id="send">Send Test Data</button>
    <div id="status"></div>
</div>

<script>
document.getElementById('send').onclick = async () => {
    document.getElementById('status').innerText = 'Sending...';

    await fetch('YOUR_WEBHOOK_URL', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            message: 'Webhook test',
            time: new Date().toISOString()
        })
    });

    document.getElementById('status').innerText = '✅ Data Sent Successfully';
};
</script>

</body>
</html>
